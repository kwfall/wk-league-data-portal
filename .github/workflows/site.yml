# WK리그 Data: 연맹 기록과 뉴스를 30분마다 다시 모아 Cloudflare(https://wk-league-data.kwfall.workers.dev/)에 배포한다.
# 내 컴퓨터에서 고친 내용을 올려도(push) 바로 다시 배포된다. 수집이 실패하면 저장소에 있는 기록으로 배포한다.
# 비공개 저장소의 무료 실행 시간(한 달 2,000분) 안에 들도록 30분마다 돈다.
# 30분마다 실행 신호는 Cloudflare Worker 가 보낸다 (Cloudflare 비밀 값 GH_TOKEN 필요).
# 필요한 비밀 값: CLOUDFLARE_API_TOKEN (저장소 Settings → Secrets and variables → Actions)
name: 기록 갱신과 배포

on:
  # 30분마다 Cloudflare(worker.js)가 workflow_dispatch 로 실행시킨다. GitHub 자체 예약은 자주 건너뛰어서 쓰지 않는다
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 이미 받은 경기 상세 페이지를 다시 받지 않도록 보관해 둔다
      - uses: actions/cache@v4
        with:
          path: cache
          key: kwff-${{ github.run_id }}
          restore-keys: kwff-
      - name: 경기 기록 수집
        continue-on-error: true
        run: node scrape.mjs 2026
      - name: 뉴스 수집
        continue-on-error: true
        run: node scrape-news.mjs
      - name: 선수 정보·해외파 수집 (하루 한 번, 새벽 3시대)
        continue-on-error: true
        run: |
          if [ "$(date +%H)" = "03" ]; then node scrape-roster.mjs; else echo "건너뜀"; fi
      - name: 배포 파일 준비
        run: node tools/build-site.mjs
        env:
          SITE_URL: https://wk-league-data.kwfall.workers.dev/
      - name: Cloudflare 에 올리기
        run: npx --yes wrangler@4.151.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
