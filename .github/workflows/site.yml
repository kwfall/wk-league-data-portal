# WK리그 Data: 연맹 기록과 뉴스를 15분마다 다시 모아 GitHub Pages 에 배포한다.
# 내 컴퓨터에서 고친 내용을 올려도(push) 바로 다시 배포된다. 수집이 실패하면 저장소에 있는 기록으로 배포한다.
name: 기록 갱신과 배포

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 이미 받은 경기 상세 페이지를 다시 받지 않도록 보관해 둔다
      - uses: actions/cache@v4
        with:
          path: cache
          key: kwff-${{ github.run_id }}
          restore-keys: kwff-
      - name: 경기 기록 수집
        continue-on-error: true
        run: node scrape.mjs 2026
      - name: 뉴스 수집
        continue-on-error: true
        run: node scrape-news.mjs
      - name: 선수 정보·해외파 수집 (하루 한 번, 새벽 3시대)
        continue-on-error: true
        run: |
          if [ "$(date +%H)" = "03" ]; then node scrape-roster.mjs && node scrape-abroad.mjs; else echo "건너뜀"; fi
      - name: 배포 파일 준비
        run: node tools/build-site.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
