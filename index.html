<script>
  // 화면이 그려지기 전에 테마를 정한다: 저장된 선택 → 없으면 기기 설정
  (function () {
    var th = null;
    try { th = localStorage.getItem('wk-theme'); } catch (e) {}
    if (th !== 'dark' && th !== 'light') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = th;
    // 보기 방식: 모바일 버전이면 mobile 표시, 휴대폰에서 PC 버전을 고르면 컴퓨터 화면 너비로 그린다
    var md = null;
    try { md = sessionStorage.getItem('wk-mode'); } catch (e) {}
    // 앱으로 설치해 열었으면 묻지 않고 화면 크기에 맞는 버전으로 연다
    if (!md && (matchMedia('(display-mode: standalone)').matches || navigator.standalone)) {
      md = matchMedia('(max-width: 900px)').matches ? 'mobile' : 'pc';
      try { sessionStorage.setItem('wk-mode', md); } catch (e) {}
    }
    if (md === 'mobile') document.documentElement.classList.add(window.top === window && !matchMedia('(max-width: 900px)').matches ? 'phone-frame' : 'mobile');
    if (md === 'pc' && matchMedia('(max-width: 900px)').matches) document.querySelector('meta[name=viewport]').setAttribute('content', 'width=1280');
  })();
</script>
